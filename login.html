<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <link rel="stylesheet" href="style.css">

  <!-- ✅ Firebase (COMPAT VERSION) -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
</head>
<body>

<div class="container">
  <h2>Login</h2>

  <input type="text" id="loginUser" placeholder="Email">
  <input type="password" id="loginPass" placeholder="Password">

  <button onclick="login()">Login</button>
  <p>No account? <a href="signup.html">Create one</a></p>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAKv8UI97QASjdizQJ81ebnusWoTLSHqYQ",
  authDomain: "ghana-quiz-earn.firebaseapp.com",
  projectId: "ghana-quiz-earn"
};

firebase.initializeApp(firebaseConfig);

function login() {
  let email = document.getElementById("loginUser").value;
  let password = document.getElementById("loginPass").value;

firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL)
  .then(() => {
    return firebase.auth().signInWithEmailAndPassword(email, password);
  })
  .then(() => {
    window.location.href = "quiz.html";
  })
  .catch(err => {
    alert(err.message);
  });   
}
</script>

</body>
</html>
