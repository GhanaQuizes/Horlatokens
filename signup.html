<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign Up - Ghana Quiz Earn</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: linear-gradient(135deg, #0f172a, #1e293b);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  color: white;
}

.container {
  width: 100%;
  max-width: 400px;
  padding: 20px;
}

.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 0 20px rgba(0,0,0,0.3);
}

h2 {
  text-align: center;
  margin-bottom: 20px;
  color: #22c55e;
}

input {
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border: none;
  border-radius: 10px;
  background: #0f172a;
  color: white;
  font-size: 14px;
}

input::placeholder {
  color: #94a3b8;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  background: #22c55e;
  color: black;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

.link {
  text-align: center;
  margin-top: 15px;
  font-size: 14px;
}

.link a {
  color: #3b82f6;
  text-decoration: none;
}

.link a:hover {
  text-decoration: underline;
}

</style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1849701324178459"
     crossorigin="anonymous"></script>
</head>

<body>

<div class="container">
  <div class="card">
    <h2>Create Account</h2>

    <input type="email" id="email" placeholder="Enter your email">
    <input type="password" id="password" placeholder="Create password">

    <button onclick="signup()">Sign Up</button>

    <div class="link">
      Already have an account? <a href="login.html">Login</a>
    </div>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAKv8UI97QASjdizQJ81ebnusWoTLSHqYQ",
  authDomain: "ghana-quiz-earn.firebaseapp.com"
};

firebase.initializeApp(firebaseConfig);

function signup() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  firebase.auth().createUserWithEmailAndPassword(email, password)
    .then(() => {
      alert("Account created successfully!");
      window.location.href = "quiz.html";
    })
    .catch(err => {
      alert(err.message);
    });
}
</script>

</body>
</html>
